  - start: "15:25"
    end: "15:35"
    speaker: "Aidan Brzakalik"
    title: "Large momentum transfer atom interferometry for ultra-precise quantum sensors"
    group: "Quantum Sensing Group"
    abstract: |
      Atom interferometry is the matter-wave analogue to optical interferometry. Laser pulses drive transitions between the ground and excited states of atoms, acting as atom-optic beam splitters and mirrors. The atom wavefunction is driven along separate paths in a superposition, then superimposed to generate interference. The Atom Interferometry and Observatory Network (AION) programme aims to build a set of atom interferometers with progressively increasing baseline and sensitivity to investigate gravitational waves in the mid-frequency band and search for ultra-light dark matter.
      
      Sensitivities beyond the capabilities of existing quantum sensors will be required. One method for increasing the sensitivity of atom interferometers is large momentum transfer, in which a sequence of laser pulses is applied during the interferometry sequence after the first atom-optic beam splitter. Each pulse increases the momentum separation of the atomic wavepacket, increasing the space-time area enclosed by the two paths, which is linearly proportional to the interferometer sensitivity. I will outline the AION programme, large momentum transfer atom interferometry and the system we are building at the University of Birmingham to investigate techniques to further enhance large momentum transfer.
