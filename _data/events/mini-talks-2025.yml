  - start: "14:30"
    end: "14:40"
    speaker: "Dylan Gower"
    title: "Topological Responses in 2D Quasicrystals"
    group: "Theoretical Physics"
    abstract: |
      Quasi-crystals are materials with broken translational invariance while maintaining long-range order. Recent research has considered topological effects in 1D quasi-crystals and discovered they are surprisingly robust to disorder. My project considers the effects of disorder on topological phases of 2D quasicrystals. In my talk I will discuss the basics of topological responses and how these can be applied to quasicrystals.
