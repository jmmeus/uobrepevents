  - start: "14:40"
    end: "14:50"
    speaker: "Aleyna Adamson"
    title: "Detecting circumbinary planets with the BEBOP radial velocity survey"
    group: "Sun, Stars, and Exoplanets"
    abstract: |
      Over 6000 exoplanets have been discovered outside of our solar system some of which orbit not just one star but two (also known as binaries). These unique planets are known as circumbinary planets and have proven difficult to detect via all exoplanet detection methods. Despite the radial velocity method being one of the most effective ways of detecting planets around single stars, only seven circumbinary planets have been detected this way. The BEBOP (Binaries Escorted By Orbiting Planets) radial velocity survey aims to detect more circumbinary planets with radial velocities extending the search into double-lined binaries where radial velocity detections are particularly challenging. In this talk I will give a brief introduction to circumbinary planets and an overview of the results of the BEBOP radial velocity survey so far.
