    speaker: "Patrick Galvin"
    title: "Large momentum transfer atom interferometry for ultra-precise quantum sensors"
    group: "Quantum Sensing / Atom Interferometry"
    abstract: >
      Atom interferometry is the matter-wave analogue to optical interferometry.
      Large momentum transfer beam splitters greatly enhance sensitivity; this talk
      investigates techniques to further enhance large momentum transfer.
