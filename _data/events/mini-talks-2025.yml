  - start: "15:15"
    end: "15:25"
    speaker: "Eddie Bannister"
    title: "The Formation of Ultracold Rubidium Strontium Molecules"
    group: "Cold Atoms"
    abstract: |
      The formation of dipolar, diatomic molecules at ultracold temperatures offers insight into the mechanisms of chemical reactions at the quantum scale as well as providing an effective testbed for quantum simulation. Rubidium Strontium molecules are to be formed from laser cooled separately cooled samples of Rb and Sr at ultracold temperatures, through the use of magnetically tuneable Feshbach resonances. These weakly bound Feshbach molecules will then be pumped into their vibrational ground state using stimulated Raman adiabatic passage to create stable alkali - alkaline earth diatomics. After this process, the products are to be characterised using a time of flight mass spectrometer in order to measure the effectiveness of the molecules forming process. At low temperatures, diatomic molecules not only exhibit quantised electronic energy levels but also interatomic vibrational and rotational energy levels. These additional degrees of freedom, combined with the strong molecular dipoles could facilitate the generation of a long range shielding force, allowing the molecules to be evaporatively cooled to a molecular Bose-Einstein condensate.
