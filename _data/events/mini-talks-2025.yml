    speaker: "Claire Rosemary Munro"
    title: "Spin Resolved ARPES"
    group: "Markovic's Group Condensed Matter"
    abstract: >
      Angle resolved photoemission spectroscopy (ARPES) is a powerful spectroscopic
      technique for investigating the electronic structure of crystalline materials. 
      This talk discusses the principles of ARPES and the added capability of spin
      resolution.
