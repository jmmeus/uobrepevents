  - start: "15:05"
    end: "15:15"
    speaker: "Kabeer Abdulhusein"
    title: "Developing Structural Analysis of Conjugated Polymers​"
    group: "Metamaterials and Nanophotonics"
    abstract: |
      The combination of electrospray deposition (ESD) and scanning tunnelling microscopy (STM) is an emerging technique for characterising conjugated polymers with sub-molecular resolution. By enabling sequencing of polymer backbones, this method provides a rare and powerful means to identify and quantify homocoupling defects, which are believed to affect polymer growth and device performance. 
      
      This work focuses on pBTTT, a prototypical polythiophene with potential applications across organic electronics and photovoltaics. By overlaying geometry-optimised molecular models onto high-resolution STM images, we resolve the precise sequence of the dithiophene and thienothiophene subunits, thereby identifying the existence, frequency and location of homocoupling defects. Statistical analysis of a representative set of polymer chains enables testing of potential correlations of such defects, shedding light on the underlying polymerisation process—an insights inaccessible through conventional analytical techniques. 
      
      At the supramolecular level, STM imaging of 2D surface assembly of pBTTT uncovers tie-chains bridging polymer islands which are assumed to facilitate macroscopic charge transport in thin films devices. In addition, the coexistence of two distinct assembly phases (a and b) is directly visualised, providing molecular-scale confirmation of polymorphism that had previously only been inferred from X-ray diffraction studies on bulk films.
