talks:
  - start: "13:30"
    end: "13:40"
    speaker: "Tom Catanach"
    title: "How and why to construct an atomic clock for TAI"
    group: "Quantum Technologies"
    abstract: |
      Atomic clocks have defined the SI second via the caesium standard since 1967. This standard forms the basis of GPS and GNSS, and is a fundamental metrological unit for all of experimental physics. The International Atomic Time (*temps atomique international*, TAI) standard aims to redefine the second via the development of an international network of modern optical clocks operating with fractional uncertainties at the 10⁻¹⁸ level, sometimes misleadingly associated with an inaccuracy corresponding to one second over the age of the universe. The new standard will be constructed from contributions by experiments utilising electron transitions in a number of elements, including Sr, Yb, Hg, Lu and more, all operating at different absolute frequencies. This requires not only exceptional control of external electromagnetic and gravitational shifts on an atomic transition, but also the capacity to translate such accuracy and precision between laboratories internationally. This talk will delve into the physics, design, and methods utilised at UoB to develop relocatable atomic clocks that operate at the 10⁻¹⁸ level.

  - start: "13:40"
    end: "13:50"
    speaker: "Gabriel Almeida"
    title: "Can exchanging space and time teach us about quantum dynamics?"
    group: "Theoretical Physics"
    abstract: |
      The dynamics of a quantum system can be viewed either as a unitary evolution in time or as a non-unitary evolution in space. Surprisingly, this space-time duality can provide useful insights into quantum dynamics. In particular, it offers a way to understand how a large quantum system can act as its own bath, allowing smaller subsystems to thermalise, and how certain non-equilibrium quantities can be expressed in terms of stationary ones. But when can this approach be used efficiently? During my PhD, I will investigate this question in integrable quantum systems.

  - start: "13:50"
    end: "14:00"
    speaker: "Matt Clay"
    title: "Self-broadening in Exoplanet Atmospheres"
    group: "Sun, Stars and Exoplanets"
    abstract: |
      Exoplanet atmospheric temperature profiles and their transmission and thermal emission spectra strongly depend on the optical properties of their constituent gases, with atmospheric opacity largely determined by molecular absorption cross sections. An important contributor to opacity in exoplanet atmospheres is pressure broadening, where molecular collisions in the atmosphere can lead to the broadening of absorption lines, which can impact the deep atmosphere/surface thermodynamic conditions. However, the broadening effects caused by collisions with background gases other than H₂, He or "air" remain largely unexplored.

      In this work, I explore the impact of incorporating self-broadened absorption cross sections into models of sub-Neptune atmospheres for a range of molecules. We generate pressure-broadened line-by-line cross sections for H₂O, CH₄, NH₃, H₂S, SO₂ and CO₂ using data from the ExoMol, HITRAN and HITEMP databases and the cross-section calculation code pyROX, under two broadening scenarios: H₂ and He, and self-broadening. These cross sections are used as the opacity input for the atmospheric model GENESIS to model the temperature profiles and simulate planetary emission and transmission spectra.

      We determine for which molecules updated cross sections may be needed as ever-smaller exoplanets are being observed, as these are likely to have higher-metallicity secondary atmospheres for which the H₂- and He-broadening assumption may not be sufficient.

  - start: "14:00"
    end: "14:10"
    speaker: "Ceyhan Sam"
    title: "The Kaon Identification System for the NA62 Experiment at CERN"
    group: "Particle Physics"
    abstract: |
      The NA62 experiment at CERN is a fixed-target experiment dedicated to studying rare kaon decays. A 400 GeV/c proton beam from the Super Proton Synchrotron (SPS) produces a 75 GeV/c secondary hadron beam with only a 6% K⁺ component, which requires tagging in flight with a timing resolution of &lt;100 ps. The kaon identification system (KTAG) is formed from a differential Cherenkov counter with achromatic ring focus (CEDAR) coupled to a bespoke photon-detection system built by the University of Birmingham, and tags incoming kaons with a timing resolution of ~66 ps and an efficiency of &gt;99%.

  - start: "14:10"
    end: "14:20"
    speaker: "Pete Walters"
    title: "DarkSPHERE: Searching for Dark Matter in the Yorkshire Moors"
    group: "Particle Physics"
    abstract: |
      The spherical proportional counter, a novel gaseous detector, has been employed in direct, low-mass particle dark matter (DM) searches thanks to its radiopure material construction, single-electron energy threshold, and flexibility to operate with a range of gases. Gases containing low-mass nuclei such as hydrogen, carbon, and neon are used in the detector to provide good kinematic matching to sub-GeV particle DM.

      The design of a proposed future experiment, DarkSPHERE, which could be operated in the Boulby Underground Laboratory, is well underway. Gas mixtures containing combinations of He, Ne, CH₄, and i-C₄H₁₀, intended for use in DarkSPHERE, require characterisation in the detector, for example by measuring electron drift times and gas gains. Measurements of these properties using a UV laser calibration system will be presented, along with comparison to Monte Carlo simulations.

