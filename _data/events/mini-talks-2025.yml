  - start: "14:00"
    end: "14:10"
    speaker: "Luke Williams"
    title: "Impact of dark matter on supermassive black hole merger rates"
    group: "Astrophysics & Space Research"
    abstract: |
      The connection between dark matter properties and supermassive black hole (SMBH) mergers remains an open question with observational consequences for gravitational wave detectors like Pulsar Timing Arrays (PTAs). 
      
      On the surface the link between PTA's and SMBH is not necessarily clear. PTA's are optimal for investigating the high mass regime of black holes at the centre of low redshift galaxies, while the choice of dark matter model is most important in the early stages of structure formation. The dark matter model chosen is important as CDM or more massive WDM particles form shallower potential wells (so the early Universe has an abundance of small DM halos), whereas less massive WDM particles form deeper potential wells (so the early Universe has fewer, more massive DM halos). We investigate how these early Universe changes present themselves at present times.
      
      The research I will be presenting involves running the DM simulations with the semi-analytical galaxy formation code Galacticus, converting the halo masses to black hole masses and computing the merger rate and characteristic strain from all the SMBH mergers per model.
