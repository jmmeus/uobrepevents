    speaker: "Eddie Bannister"
    title: "Hunting asymmetric dark matter via gravitational waves"
    group: "Gravitational Waves / Theory"
    abstract: >
      If dark matter is asymmetric, primordial black holes may form with unique
      mass distributions. This talk covers how gravitational wave signatures can be
      used to probe asymmetric dark matter scenarios.
