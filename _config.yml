# Site settings
title: "UoB Research Events"
description: "University of Birmingham Research Events System"
baseurl: "" # Leave empty for org sites, or "/repo-name" for project sites
url: "https://username.github.io" # Your GitHub Pages URL

# Collections
collections:
  events:
    output: true
    permalink: /events/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"

# Build settings
markdown: kramdown
theme: null  # We're using custom layouts

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Timezone (adjust as needed)
timezone: Europe/London

# Site contact
email: "events@example.ac.uk"

# GitHub repository (auto-populated by GitHub Pages, but can override)
github:
  repository_url: "https://github.com/username/repo"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - .git/
  - .github/
  - README.md
  - docs/milestone-*.md
