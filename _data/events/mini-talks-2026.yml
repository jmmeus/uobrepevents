  - start: "14:35"
    end: "14:45"
    speaker: "George Hookway"
    title: "Asteroseismology (or wobbly stars)"
    group: "Sun, Stars and Exoplanets"
    abstract: |
      Much like jelly, stars wobble. These internal waves generate oscillations visible on the surface. By measuring the frequencies of these oscillations we can learn a lot about these stars, such as their radius, mass, age and composition. My PhD is focused on the identification and characterisation of the modes of oscillation in stars similar to our Sun.

  - start: "14:45"
    end: "14:55"
    speaker: "Barnaby Spooner"
    title: "Detecting the First Gravitationally Lensed Gamma-Ray Burst"
    group: "Astrophysics & Space Research"
    abstract: |
      Gravitational lensing offers many exciting opportunities across astrophysics, cosmology, and fundamental physics. Gamma-ray bursts that have been gravitationally lensed offer the opportunity to constrain the Hubble constant to extremely high precision and can be very precise probes of the dark matter substructure in the Universe. To date, however, a lensed gamma-ray burst is yet to be discovered, primarily because of the difficulty in finding their position on the sky. In this talk, I will introduce the topic of gravitationally lensed gamma-ray bursts and talk about my work, as well as the wider research being done in Birmingham, in trying to make the first ever detection of this rare phenomenon.

  - start: "14:55"
    end: "15:05"
    speaker: "Samira Said"
    title: "An In Situ Tunable Uniaxial Stress Cell for ARPES"
    group: "Condensed Matter"
    abstract: |
      Stress tuning as a probing technique has been used with great success to unlock the hidden complexities of quantum materials. Combined with angle-resolved photoemission spectroscopy (ARPES), a technique to directly access the band structure of materials, it can be used to understand superconductivity, magnetism and the behaviour of a range of ordered phases. This talk will discuss a new design for a uniaxial stress cell, custom designed for the nano-ARPES end station at Diamond Light Source, that will be made available to all end station users.

  - start: "15:05"
    end: "15:15"
    speaker: "William Parfitt"
    title: "Phonon-Exciton Polaritons in Plasmonic Nanocavities"
    group: "Metamaterials and Nanophotonics"
    abstract: |
      Quantum emitters within nanoplasmonic cavities offer an effective method of achieving strong light-matter coupling through extreme electromagnetic field confinement. Using dual-wavelength nanoantennae and the IR-active molecular vibrational modes of quantum emitters allows us to couple to the molecule at both visible and infrared frequencies, enabling simultaneous excitation and mixing of both excitonic and phononic polariton modes. By understanding the behaviour of these sorts of systems, we aim to design and model systems that can sensitively interact with IR light without requiring cryogenic temperatures.

