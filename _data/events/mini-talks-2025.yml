    title: "Novel method using magnetic tweezers for the detection of proteins"
    group: "Quantum Biology / Biophysics"
    abstract: >
      Magnetic tweezers are a versatile tool used for the investigation of nucleic
      acids and protein interactions. This talk discusses their application toward
