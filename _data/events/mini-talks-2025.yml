  - start: "14:20"
    end: "14:30"
    speaker: "Patrick Galvin"
    title: "Exploring the Application of the Trojan Horse Method to Neutron Capture Reactions for Fusion"
    group: "Nuclear Physics"
    abstract: |
      Accurately predicting activation properties of materials under neutron irradiation in planned nuclear fusion reactors is an essential step in advancing the technology's viability. However, for many reactions of interest, this requires specialist facilities, and it can be difficult to obtain the neutron fluxes needed for direct activation experiments. The Trojan Horse Method (THM) is an indirect route to measuring nuclear reaction cross-sections at low energies that are relevant to astrophysics, for which it was developed, and has been investigated for its application to neutron-capture reactions relevant to fusion.
      
      This method utilises a clustered nucleus taking part in a three-body reaction, under kinematic conditions where one component of the cluster dominates the interaction, allowing its cross-section to be measured at energies below that of the whole cluster. In this work, the THM will be used to measure neutron-induced reaction cross-sections via a deuteron, a p⨁n cluster, taking advantage of the ease and high fluxes of a deuteron beam compared to alternative methods.
      
      This method was explored both through Monte Carlo simulations and preliminary laboratory measurements, beginning with the well-understood 27Al(n,γ)28Al reaction and considering its expansion to reactions upon heavier nuclei, relevant to the fusion sector, including the planned measurement of the 93Nb(n,γ)94Nb cross-section via the 93Nb(d,pγ)94Nb reaction.
