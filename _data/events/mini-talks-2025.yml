  - start: "14:10"
    end: "14:20"
    speaker: "Claire Munro"
    title: "Spin Resolved ARPES"
    group: "Markovic's Group Condensed Matter"
    abstract: |
      Angle resolved photoemission spectroscopy (ARPES) is a technique used to directly analyse the band structure of materials. Analysing the band structures of materials provides interesting information about the physical properties of the material. 
      
      My research project aims to investigate spin orbit interactions in lacunar spinels using ARPES to probe the electronic structure. Lacunar spinels are a relatively underexplored class of materials that exhibit a rich array of exciting physical phenomena such as spin-orbit correlated insulator phases, skyrmion lattices and insulator to metal transitions and superconductivity under pressure. Utilising ARPES to gain insight into the electronic structure, this research focuses on uncovering the interplay between spin orbit coupling, electronic interactions and structural features of lacunar spinels. 
      
      Many exciting properties have been speculated for the lacunar spinel structures which can be investigated through the electronic structure and behaviour of the material. However, there is yet to be a thorough direct experimental investigation into the electronic band structure. Electronic band structures can support theoretical predictions and enhance the understanding of these characteristics.
